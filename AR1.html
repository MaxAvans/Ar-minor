<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Paintball</title>
  
  <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/jeromeetienne/AR.js/2.1.4/aframe/build/aframe-ar.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #vizier {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1000;
    }
    #vizier::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    #uiTekst {
      position: fixed;
      bottom: 40px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 5px #000000;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div id="vizier"></div>
  <div id="uiTekst">Tik op het scherm om te schieten</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    <a-camera id="mijnCamera" position="0 1.6 0"></a-camera>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const camera = document.getElementById('mijnCamera');

    const kleuren = [
      '#ff0000', '#00ff00', '#0000ff', '#ffff00', 
      '#ff00ff', '#00ffff', '#ff8800', '#ff0088'
    ];

    window.addEventListener('click', function() {
      const willekeurigeKleur = kleuren[Math.floor(Math.random() * kleuren.length)];

      const verfbal = document.createElement('a-sphere');
      verfbal.setAttribute('radius', '0.15');
      verfbal.setAttribute('color', willekeurigeKleur);
      verfbal.setAttribute('material', 'roughness: 0.1; metalness: 0.2');

      const camPos = camera.getAttribute('position');
      verfbal.setAttribute('position', `${camPos.x} ${camPos.y} ${camPos.z}`);

      const richting = new THREE.Vector3(0, 0, -1);
      richting.applyQuaternion(camera.object3D.quaternion);

      const afstand = 8;
      const doelX = camPos.x + richting.x * afstand;
      const doelY = camPos.y + richting.y * afstand;
      const doelZ = camPos.z + richting.z * afstand;

      verfbal.setAttribute('animation__vlucht', `
        property: position; 
        to: ${doelX} ${doelY} ${doelZ}; 
        dur: 600; 
        easing: linear;
      `);

      setTimeout(() => {
        verfbal.setAttribute('animation__klets', `
          property: scale; 
          to: 2 2 0.05; 
          dur: 150; 
          easing: easeOutQuad;
        `);
      }, 600);

      scene.appendChild(verfbal);
    });
  </script>

</body>
</html>
